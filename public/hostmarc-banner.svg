<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />

    <line x1="80" y1="0" x2="80" y2="500" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="240" y1="0" x2="240" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="560" y1="0" x2="560" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
    <line x1="720" y1="0" x2="720" y2="500" />
  </g>

  <!-- Glowing Accent Aura -->
  <circle cx="200" cy="180" r="160" fill="#2563eb" opacity="0.18" filter="blur(60px)" />
  <circle cx="600" cy="300" r="180" fill="#06b6d4" opacity="0.15" filter="blur(60px)" />

  <!-- Top Brand Navigation Bar -->
  <rect x="40" y="30" width="720" height="50" rx="12" fill="#1e293b" opacity="0.8" stroke="#334155" stroke-width="1" />
  <circle cx="65" cy="55" r="5" fill="#ef4444" />
  <circle cx="82" cy="55" r="5" fill="#f59e0b" />
  <circle cx="99" cy="55" r="5" fill="#10b981" />
  <text x="130" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">https://hostmarc.pages.dev · Independent Hardware &amp; Web Benchmarks</text>
  <rect x="640" y="43" width="100" height="24" rx="6" fill="#2563eb" opacity="0.2" stroke="#3b82f6" stroke-width="1" />
  <text x="655" y="59" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="700">LIVE VENTURE</text>

  <!-- Main Hero Card inside Mockup -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="720" height="360" rx="16" fill="url(#cardBg)" stroke="#374151" stroke-width="1.5" />
    
    <!-- Left Column: Branding & Value -->
    <g transform="translate(70, 140)">
      <rect x="0" y="0" width="120" height="26" rx="13" fill="#2563eb" opacity="0.2" stroke="#3b82f6" stroke-width="1" />
      <text x="14" y="17" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">HOSTMARC.IO</text>
      
      <text x="0" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Websites, Hosting &amp;</text>
      <text x="0" y="102" fill="url(#blueGlow)" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Measured Growth.</text>
      
      <text x="0" y="140" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">Independent server benchmarks, high-performance</text>
      <text x="0" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">hosting telemetry and web engineering by Farhan Momen.</text>

      <!-- Trust Badges -->
      <g transform="translate(0, 195)">
        <rect x="0" y="0" width="140" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#10b981" />
        <text x="28" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TTFB 42ms Global</text>
        
        <rect x="150" y="0" width="140" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="166" cy="16" r="4" fill="#38bdf8" />
        <text x="178" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">NVMe SSD Edge</text>
      </g>
    </g>

    <!-- Right Column: Visual Telemetry Graph -->
    <g transform="translate(420, 130)">
      <rect x="0" y="0" width="310" height="290" rx="12" fill="#0b0f19" stroke="#1f2937" stroke-width="1.5" />
      
      <!-- Graph Header -->
      <text x="20" y="32" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SERVER BENCHMARK METRICS</text>
      <text x="20" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Latency &amp; Throughput Monitor</text>
      
      <!-- Metric Cards -->
      <rect x="20" y="65" width="125" height="55" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="32" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">RESPONSE TIME</text>
      <text x="32" y="108" fill="#10b981" font-family="system-ui, sans-serif" font-size="18" font-weight="800">18.4 ms</text>
      
      <rect x="165" y="65" width="125" height="55" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="177" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">UPTIME SLA</text>
      <text x="177" y="108" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="800">99.99%</text>

      <!-- SVG Graph Line -->
      <path d="M 20 220 Q 70 170 120 190 T 210 150 T 290 140" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
      <path d="M 20 220 Q 70 170 120 190 T 210 150 T 290 140 L 290 260 L 20 260 Z" fill="url(#blueGlow)" opacity="0.15" />
      
      <!-- Data Points -->
      <circle cx="120" cy="190" r="4" fill="#38bdf8" stroke="#0b0f19" stroke-width="2" />
      <circle cx="210" cy="150" r="4" fill="#38bdf8" stroke="#0b0f19" stroke-width="2" />
      <circle cx="290" cy="140" r="5" fill="#10b981" stroke="#0b0f19" stroke-width="2" />

      <!-- Timeline Axis -->
      <line x1="20" y1="260" x2="290" y2="260" stroke="#334155" stroke-width="1" />
      <text x="20" y="278" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Tokyo</text>
      <text x="100" y="278" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Sydney</text>
      <text x="180" y="278" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">London</text>
      <text x="250" y="278" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Ashburn</text>
    </g>
  </g>
</svg>
